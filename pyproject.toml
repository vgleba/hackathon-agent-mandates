[tool.ruff]
line-length = 120
target-version = 'py312'
# mcp_server (incl. mcp_server/synth), shared_utils are frozen hackathon fixtures (see AGENTS.md "Leave alone")
exclude = ["terraform/diagram_script.py", "aws_architecture.jpg", "gateway/lib", ".claude", "mcp_server", "shared_utils"]

[tool.cruft]
skip = [
    
    # fastapi_paths
    "mcp_server/fastapi/settings.py",
    "mcp_server/fastapi/tests.py",
    # general_paths
    ".env.*",
    ".github/.github.env",
    ".github/workflows",
    "mcp_server/data",
]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra -q"
testpaths = [
    "gateway/tests",
    "hackathon",
    "mcp_server/synth/tests"
]

[project]
name = "agent-mandate-hack"
version = "0.1.0"
description = ""
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "i.AI", email = "i-dot-ai-enquiries@dsit.gov.uk"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=4.1.4",
]

[project.optional-dependencies]
fastapi = [
    "certifi>=2026.10.19",
    "fastapi>=0.112.0",
    "decorator>=5.1.1",
    "pydantic-settings>=2.5.2",
    "uvicorn>=0.31.0",
    "pyjwt>=2.9.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "python-keycloak>=4.7.3",
    "i-dot-ai-utilities>=0.3.0",
]
gateway = [
    "fastapi>=0.112.0",
    "uvicorn>=0.31.0",
    "pyjwt>=2.9.0",
    "cryptography>=42",
]
synth = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6",
    "pydantic>=2",
]



[dependency-groups]
dev = [
    "bumpversion>=0.6.0",
    "pytest>=8.3.2",
    "pytest-env>=1.1.1",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.6",
    "bandit>=1.7.9",
    "detect-secrets>=1.5.0",
    "playwright>=1.45",
    "pytest-playwright>=0.5",
    "diagrams>=0.23.4",
    "httpx==0.28.0",
]

[tool.ruff.format]
exclude = ["mcp_server/data/*"]

[tool.ruff.lint]
# Dribble in those we have commented out, asterisked ones first
select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "G",
    "I",
    "N",
    "Q",
    "S",
    "T",
    "W",
    "ARG",
    "ASYNC",
    "BLE",
    "COM",
    "DJ",
    "DTZ",
    "EM",
    "EXE",
    "FURB",
    "ICN",
    "INT",
    "ISC",
    "LOG",
    "NPY",
    "PD",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "SLOT",
    "TCH",
    "TD",
    "TID",
    "TRY",
    "UP",
    "YTT",
]
exclude = ["out/*"]
ignore = ["COM812", "DJ001", "RET505", "RET508", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_server", "frontend", "gateway"]

[tool.ruff.lint.per-file-ignores]
"gateway/cli.py" = ["T201"]
"gateway/eval.py" = ["T201", "PLR2004"]
"gateway/eval_open.py" = ["T201", "PLR2004"]
"tests/*" = ["S101", "S106", "PLR0913", "PLR0915", "PLR2004", "TD003", "S311"]
"*/tests/*" = ["S101", "S106", "PLR0913", "PLR0915", "PLR2004", "TD003"]
"*/tests_playwright/*" = ["S101", "S106", "PLR0913", "PLR2004", "TD003"]
