# What gets deployed: the data server and the gateway. `make run` starts exactly this.
# The walkthrough UI and the gateway's /demo routes, which sign mandates for anyone who asks, are local only:
# docker-compose.demo.yaml, started by `make hack` and `make demo` (adr/0001-gateway-image-is-the-security-boundary.md).
services:

  backend:
    build:
      context: .
      dockerfile: ./mcp_server/Dockerfile
    volumes:
      - ./mcp_server/data:/app/mcp_server/data
    container_name: mcp-backend
    # not published: it has no access control, so only the gateway may reach it
    expose:
      - "8080"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/healthcheck" ]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 3s
    networks:
      - agent-mandate-hack-network

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: gateway
    ports:
      - "8082:8082"
    volumes:
      - ./gateway/state:/app/gateway/state
    environment:
      - MCP_SERVERS=pupil-data=http://backend:8080/mcp/
      - GATEWAY_STATE_DIR=/app/gateway/state
      - LITELLM_KEY=${LITELLM_KEY:-}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-}
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8082/healthcheck" ]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 3s
    networks:
      - agent-mandate-hack-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  agent-mandate-hack-network:
    driver: bridge
